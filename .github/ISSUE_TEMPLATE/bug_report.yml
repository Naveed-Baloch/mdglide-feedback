name: Bug report
description: Report a reproducible problem in MD Glide.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Reports and attachments are public. Remove private content, credentials, personal information, and sensitive file paths. Use a sanitized sample."
  - type: checkboxes
    id: checks
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private or sensitive information from this report and its attachments.
          required: true
  - type: input
    id: extension
    attributes:
      label: MD Glide version
      placeholder: "For example: 2.0.0 (Chrome Extensions → MD Glide → Details)"
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "Copy the version from Chrome → About Google Chrome"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "For example: macOS 15, Windows 11, Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Where does the problem occur?
      options:
        - Local file dragged into Chrome
        - File opened through the extension
        - Markdown web page
        - Editing or saving
        - Exporting
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Choose…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Sanitized Markdown sample, screenshots, or other details
      description: "Optional. Share only content you are comfortable making public."
